# Secret & credential leakage - runs on every text file
rules:
- id: SEC-001
  title: Private key material committed
  type: pattern
  severity: CRITICAL
  confidence: high
  languages: []
  pattern: '-----BEGIN (RSA |EC |OPENSSH |DSA |PGP |ENCRYPTED )?PRIVATE KEY( BLOCK)?-----'
  message: A private key is committed to the repository.
  remediation: Remove the key immediately, revoke it, rotate the credential, and purge git history (git filter-repo / BFG).
  cwe: [CWE-798, CWE-312]
  owasp: [A07:2021]
  tags: [secrets, key]
- id: SEC-002
  title: AWS access key id
  type: pattern
  severity: CRITICAL
  confidence: high
  languages: []
  pattern: '\b(AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}\b'
  message: Hard-coded AWS access key id.
  remediation: Move to environment variables or a secrets manager; rotate the key.
  cwe: [CWE-798]
  owasp: [A07:2021]
  tags: [secrets, aws]
- id: SEC-003
  title: Generic hard-coded password/secret assignment
  type: pattern
  severity: HIGH
  confidence: medium
  languages: []
  pattern: '(?i)(password|passwd|pwd|secret|api[_-]?key|auth[_-]?token|access[_-]?token|client[_-]?secret)[\s''"]{0,3}[:=][\s''"]{0,3}[A-Za-z0-9+/=_@#!$%&*.?-]{8,}'
  context: '(?i)^(?![^\n]*(process\.env|os\.environ|getenv|env\(|config\(|\{\{|<\?)[^\n]*$).*$'
  message: A credential-looking value is hard-coded.
  remediation: Load from environment/secret manager. Never commit credentials.
  cwe: [CWE-798]
  owasp: [A07:2021]
  tags: [secrets]
- id: SEC-004
  title: Connection string with embedded password
  type: pattern
  severity: CRITICAL
  confidence: high
  languages: []
  pattern: '(?i)(postgres(ql)?|mysql|mongodb(\+srv)?|redis|amqp|mssql|sqlserver|jdbc:[a-z]+)://[^\s"''/:]+:[^\s"''/@]+@'
  message: Database/broker connection string contains a password.
  remediation: Inject via secret manager or env vars; rotate the exposed password.
  cwe: [CWE-798]
  owasp: [A07:2021]
  tags: [secrets, database]
- id: SEC-005
  title: Bearer/JWT token literal
  type: pattern
  severity: HIGH
  confidence: medium
  languages: []
  pattern: 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
  message: A JWT (or JWT-shaped token) is committed.
  remediation: Leaked tokens must be treated as compromised; revoke and store outside the repo.
  cwe: [CWE-798]
  owasp: [A07:2021]
  tags: [secrets, token]
- id: SEC-006
  title: Committed .env file containing secrets
  type: file
  severity: HIGH
  confidence: high
  languages: [envfile]
  pattern: '(?i)(password|secret|key|token)\s*=\s*\S+'
  message: An .env file containing secrets is committed.
  remediation: Remove from VCS, add to .gitignore, rotate every secret inside, use .env.example with placeholders.
  cwe: [CWE-538, CWE-312]
  owasp: [A05:2021]
  tags: [secrets, config]
- id: SEC-007
  title: Well-known service token (Slack/GitHub/GitLab/Stripe/OpenAI)
  type: pattern
  severity: HIGH
  confidence: high
  languages: []
  pattern: '\b(xox[baprs]-[0-9A-Za-z-]{10,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|glpat-[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9]{10,}|sk-[A-Za-z0-9]{20,})\b'
  message: A well-known service token is committed.
  remediation: Revoke the token and load it from a secrets manager.
  cwe: [CWE-798]
  owasp: [A07:2021]
  tags: [secrets, token]
